<style>
  @font-face { font-family: 'Literata'; src: url('./literata-400.woff') format('woff'); font-weight: 400; font-display: swap; }

  button, input { font: inherit; color: inherit; }

  button.ember.on { background: rgba(255, 106, 61, 0.22); border-color: rgba(255, 106, 61, 0.6); }

  #band { position: fixed; left: 0; right: 0; top: 0; height: 42%; background: rgba(11, 13, 18, 0.82); border-bottom: 1px dashed rgba(216, 220, 230, 0.35); display: none; align-items: flex-end; padding: 0 22px 26px; box-sizing: border-box; pointer-events: none; }

  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }

<script type="module">
import * as THREE from '../../../node_modules/three/build/three.module.js';

// ---------------------------------------------------------------------------
// Units: the horizon radius r_s = 1. Shadow (photon capture) radius 2.6. Disk from the ISCO at 3 out
// to 12. Jets along ±y from 2.4 up. Everything is drawn as dots; the lensing is a cheap
// weak-field bend (image radius b' from the true transverse offset b and the depth d behind the hole),
// then an exclusion that piles anything inside the shadow onto its edge, so the shadow stays black.
// ---------------------------------------------------------------------------

const B_CRIT = 2.6;
const OMEGA0 = 3.1;           // ω(r) = OMEGA0 · r^-1.5  (period 10 s at the ISCO)
const REF_DIST = 75;          // camera distance at which dot sizes are their CSS size
const STRAND = { lin: 40, lstr: 103, rJoin: 6.5, pitch: 0.11, rMean: 5.5 };
const KNOT_SLOTS = 24, KNOT_DOTS = 56, KNOT_V = 6.0;

// ------------------------------- GLSL ---------------------------------------

const COMMON = /* glsl */`
  uniform float uTime, uScale, uDpr, uRefDist, uBcrit, uLop, uGain, uBend;
  uniform vec3 uCamPos;
  uniform mat3 uInvRot;
  varying vec4 vC; varying float vS;
  float hash(float n){ return fract(sin(n*12.9898+78.233)*43758.5453); }
  float hash2(float a,float b){ return hash(a*7.13+b*3.71+1.7); }
  // Doppler beaming for matter at local p moving along unit v at beta: (gain, factor).
  vec2 doppler(vec3 p, vec3 v, float beta){
    vec3 toCam = normalize(uCamPos - p);
    float c = dot(v, toCam);
    float g = sqrt(max(1.0 - beta*beta, 0.0)) / (1.0 - beta*c);
    return vec2(pow(g, 3.0*uLop), g);
  }
  // Disk colour: orange-white receding, blue-white approaching, whiter when hot.
  vec3 temp(float g, float heat){
    vec3 warm = vec3(1.0, 0.64, 0.36), cool = vec3(0.55, 0.76, 1.0), white = vec3(0.96, 0.97, 1.0);
    float m = smoothstep(0.72, 1.32, 1.0 + (g - 1.0)*uLop);
    return mix(mix(warm, cool, m), white, heat*0.42);
  }
  // Bend a view-space point pv about the hole at hv. image 0: primary; 1: the far side's underside arc.
  vec3 lens(vec3 pv, vec3 hv, float image, out float ok){
    vec3 rel = (pv - hv) / uScale;
    float d = -rel.z;                      // depth behind the hole, in r_s
    vec2 t = rel.xy; float b = length(t);
    float deff = max(d, 0.0) + 0.45*exp(-abs(d));
    float disc = sqrt(b*b + 8.0*uBend*deff);
    float bp; ok = 1.0;
    if (image < 0.5) {
      bp = 0.5*(b + disc);
      if (d > 0.0 && bp < uBcrit) ok = 0.0;       // captured
      ok *= 1.0 + 0.45*smoothstep(0.0, 3.0, d);   // the far side's image is magnified
    } else {
      if (d < 0.4) ok = 0.0;                      // only the far side has an underside image
      bp = 0.5*(disc - b);
      bp = uBcrit + (bp - uBcrit)*0.35;           // hugs the shadow
      t = -t;
    }
    float x = bp - uBcrit; float k = 10.0;
    float sp = log(1.0 + exp(k*min(x, 30.0)))/k;  // softplus: inside piles up at the edge
    ok *= mix(0.22, 1.0, smoothstep(-0.3, 0.45, x)); // what piles on the rim is smeared thin
    bp = uBcrit + 0.03 + sp;
    vec2 tp = (b > 1e-4) ? t*(bp/b) : vec2(0.0, bp);
    float w = d > 0.0 ? 1.0 : exp(d/3.0);         // flatten to the hole's plane near it
    float z = mix(rel.z, 0.0, w);
    return hv + vec3(tp, z)*uScale;
  }
  void emit(vec3 viewPos, vec3 rgb, float a, float sizePx, float ok){
    gl_Position = projectionMatrix * vec4(viewPos, 1.0);
    float s = sizePx * uDpr * clamp(uRefDist / max(-viewPos.z, 1.0), 0.4, 2.2);
    s = max(s, 1.0*uDpr);
    gl_PointSize = s; vS = s; vC = vec4(rgb, clamp(a*min(ok, 1.0), 0.0, 1.0));
    if (ok < 0.01) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); vC.a = 0.0; }
  }
  vec3 holeView(){ return (modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz; }
`;

const FRAG = /* glsl */`
  varying vec4 vC; varying float vS;
  void main(){
    vec2 q = (gl_PointCoord - 0.5) * vS;
    float d = length(q); float r = vS*0.5;
    float e = 1.0 - smoothstep(r - 0.75, r + 0.25, d);
    float a = vC.a * e;
    gl_FragColor = vec4(vC.rgb * a, a);
  }
`;

const DISK_VERT = COMMON + /* glsl */`
  attribute float aR, aPhi, aH, aBright, aSize;
  uniform float uImage, uDiskGain, uOmega0;
  void main(){
    float r = aR;
    float phi = aPhi + uOmega0 * pow(r, -1.5) * uTime;
    vec3 p = vec3(r*cos(phi), aH, r*sin(phi));
    vec3 v = vec3(-sin(phi), 0.0, cos(phi));
    vec2 dp = doppler(p, v, sqrt(0.5/max(r, 2.75)));
    float heat = clamp((6.5 - r)/4.0, 0.0, 1.0);
    float radial = pow(3.0/r, 1.25) * smoothstep(2.7, 3.3, r);
    float grav = max(1.0 - 1.0/r, 0.0);
    float outer = 1.0 - smoothstep(10.0, 12.5, r);
    float I = aBright * radial * dp.x * grav * outer * uDiskGain * uGain * (uImage > 0.5 ? 0.55 : 1.0);
    vec3 hv = holeView();
    vec3 pv = (modelViewMatrix * vec4(p, 1.0)).xyz;
    float ok; vec3 lv = lens(pv, hv, uImage, ok);
    float size = aSize + 0.7*clamp(I - 1.0, 0.0, 1.5);
    emit(lv, temp(dp.y, heat), I, size, ok);
  }
`;

const JET_VERT = COMMON + /* glsl */`
  attribute float aS0, aAng, aRad, aSide, aBright, aSeed;
  uniform float uJetLen, uJetW, uJetGain, uJetV;
  float rho(float s){ return uJetW * 0.5 * pow(max(s, 0.0), 0.65); }
  void main(){
    float s = mod(aS0*uJetLen + uJetV*uTime*(0.5 + 0.5*hash(aSeed)), uJetLen);
    float rr = rho(s) * aRad;
    float ang = aAng + uTime*0.12*aSide;
    vec3 p = vec3(rr*cos(ang), aSide*(2.4 + s), rr*sin(ang));
    float fade = smoothstep(0.0, 1.2, s) * (1.0 - smoothstep(uJetLen*0.78, uJetLen, s));
    float I = aBright * fade * 0.85/(1.0 + s/9.0) * uJetGain * uGain;
    vec3 col = mix(vec3(0.30, 0.64, 1.0), vec3(0.64, 0.40, 1.0), smoothstep(0.0, 1.0, s/uJetLen));
    vec3 hv = holeView();
    vec3 pv = (modelViewMatrix * vec4(p, 1.0)).xyz;
    float ok; vec3 lv = lens(pv, hv, 0.0, ok);
    emit(lv, col, I, 1.25, ok);
  }
`;

const KNOT_VERT = COMMON + /* glsl */`
  attribute float aSlot, aSide, aBright, aSeed; attribute vec3 aOff;
  uniform float uKnotI, uKnotK, uKnotV, uEmberFrom, uEmberTo, uEmberFrac, uKnotGain, uJetLen, uJetW;
  float rho(float s){ return uJetW * 0.5 * pow(max(s, 0.0), 0.65); }
  void main(){
    float I0 = uKnotI; float j = aSlot;
    float n = floor((uTime - j*I0)/(uKnotK*I0));
    float k = n*uKnotK + j + 1000.0*aSide + 2000.0;
    float T = (n*uKnotK + j)*I0 + 0.5*I0*hash(k + 3.0);
    float s = (uTime - T)*uKnotV;
    float ok = (s >= 0.0 && s <= uJetLen && uKnotGain > 0.001) ? 1.0 : 0.0;
    float ember = (T >= uEmberFrom && T <= uEmberTo && hash(k + 11.0) < uEmberFrac) ? 1.0 : 0.0;
    float r = rho(s);
    vec3 off = vec3(aOff.x*r*0.45, aOff.y*(0.4 + 0.02*s), aOff.z*r*0.45);
    vec3 p = vec3(off.x, aSide*(2.4 + s + off.y), off.z);
    float fade = smoothstep(0.0, 1.0, s) * (1.0 - smoothstep(uJetLen*0.86, uJetLen, s));
    vec3 col = mix(vec3(0.78, 0.90, 1.0), vec3(1.0, 0.44, 0.25), ember);
    float I = aBright * fade * uKnotGain * uGain;
    vec3 hv = holeView();
    vec3 pv = (modelViewMatrix * vec4(p, 1.0)).xyz;
    float ok2; vec3 lv = lens(pv, hv, 0.0, ok2);
    emit(lv, col, I, 2.3, ok*ok2);
  }
`;

const RING_VERT = COMMON + /* glsl */`
  attribute float aAng, aJit, aBright;
  uniform float uRingGain;
  void main(){
    float a = aAng;
    vec3 e = uInvRot * vec3(cos(a), sin(a), 0.0);
    vec3 planar = normalize(vec3(e.x, 0.0, e.z) + vec3(1e-4, 0.0, 0.0));
    float phi = atan(planar.z, planar.x);
    vec3 v = vec3(-sin(phi), 0.0, cos(phi));
    vec2 dp = doppler(planar*2.6, v, 0.42);
    float I = aBright * pow(max(dp.x, 0.0), 0.6) * 0.42 * uRingGain * uGain;
    vec3 hv = holeView();
    float rr = uBcrit*1.02 + aJit*0.02;
    vec3 lv = hv + vec3(cos(a), sin(a), 0.0)*rr*uScale;
    emit(lv, temp(dp.y, 0.7), I, 1.3, 1.0);
  }
`;

const BG_VERT = COMMON + /* glsl */`
  attribute vec3 aDir; attribute float aBright, aWarm;
  uniform float uBgGain;
  void main(){
    vec3 hv = holeView();
    vec3 pv = (modelViewMatrix * vec4(aDir*120.0, 1.0)).xyz;
    vec3 dv = normalize(pv);
    float ok = dv.z < -0.15 ? 1.0 : 0.0;
    vec3 pp = dv * (hv.z / min(dv.z, -0.15));       // on the hole's plane
    vec3 rel = (pp - hv)/uScale;
    vec2 t = rel.xy; float b = length(t);
    float thE = uBcrit*1.25;
    float bp = 0.5*(b + sqrt(b*b + 4.0*thE*thE));
    vec2 tp = (b > 1e-4) ? t*(bp/b) : vec2(0.0, bp);
    vec3 lv = hv + vec3(tp, 0.0)*uScale;
    vec3 col = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.80, 0.55), aWarm);
    emit(lv, col, aBright * uBgGain, 1.0, ok);
  }
`;

const INFALL_VERT = COMMON + /* glsl */`
  attribute float aSlot, aTrail, aSeed;
  uniform float uInfallGain, uOmega0;
  void main(){
    float P = 9.0 + 5.0*hash(aSlot + 0.5);
    float off = P*hash(aSlot + 1.5);
    float tt = uTime + off;
    float n = floor(tt/P);
    float fallDur = 2.8;
    float u = (tt - n*P)/fallDur - aTrail*0.035;
    float ok = (u >= 0.0 && u <= 1.0) ? 1.0 : 0.0;
    float h1 = hash2(aSlot, n), h2 = hash2(aSlot + 3.0, n), h3 = hash2(aSlot + 5.0, n), h4 = hash2(aSlot + 7.0, n);
    float th0 = mix(0.25, 1.0, h1) * (h2 < 0.5 ? -1.0 : 1.0);
    float phi0 = h3*6.2832;
    float R0 = 15.0 + 6.0*h4;
    float r1 = 4.5 + 5.5*hash2(aSlot + 9.0, n);
    float dphi = 1.6 + 2.4*hash2(aSlot + 11.0, n);
    float e = pow(u, 1.8);
    float rho = mix(R0*cos(th0), r1, e);
    float y = R0*sin(th0)*pow(1.0 - e, 1.4);
    float phi = phi0 + dphi*e + uOmega0*pow(r1, -1.5)*uTime*e;
    vec3 p = vec3(rho*cos(phi), y, rho*sin(phi));
    float fade = smoothstep(0.0, 0.12, u) * (1.0 - smoothstep(0.86, 1.0, u));
    float I = (0.95 - 0.18*aTrail) * fade * uInfallGain * uGain;
    vec3 hv = holeView();
    vec3 pv = (modelViewMatrix * vec4(p, 1.0)).xyz;
    float ok2; vec3 lv = lens(pv, hv, 0.0, ok2);
    emit(lv, vec3(0.86, 0.91, 1.0), I, 1.6, ok*ok2);
  }
`;

const STRAND_VERT = COMMON + /* glsl */`
  attribute float aQ, aSeed; attribute vec2 aJit;
  uniform float uHead, uTail, uHeat, uStrandGain, uOmega0, uLin, uLstr, uRJoin, uPitch, uRMean;
  uniform vec3 uSource;
  void main(){
    float q = aQ;
    float vis = (q >= uTail && q <= uHead) ? 1.0 : 0.0;
    float wj = uOmega0 * pow(uRMean, -1.5);
    float rot = wj * uTime;
    vec3 p; float r;
    if (q >= 0.0) {
      float psi = q / uRMean;
      r = uRJoin - uPitch*psi;
      float phi = psi + rot;
      p = vec3(r*cos(phi), 0.0, r*sin(phi));
      // widen as a thread: in-plane radial and a little vertical
      p += vec3(cos(phi), 0.0, sin(phi))*aJit.x*0.14 + vec3(0.0, aJit.y*0.07, 0.0);
    } else {
      float u = (q + uLin)/uLin;
      vec3 J = vec3(uRJoin*cos(rot), 0.0, uRJoin*sin(rot));
      vec3 T = normalize(vec3(-uPitch*cos(rot) - uRJoin*sin(rot), 0.0, -uPitch*sin(rot) + uRJoin*cos(rot)));
      vec3 P0 = uSource, P3 = J;
      vec3 P1 = P0 + (P3 - P0)*0.35 + vec3(0.0, -3.0, 0.0);
      vec3 P2 = J - T*10.0;
      float w = 1.0 - u;
      p = w*w*w*P0 + 3.0*w*w*u*P1 + 3.0*w*u*u*P2 + u*u*u*P3;
      p += vec3(aJit.x, aJit.y, aJit.x*0.5)*0.16*(1.0 - 0.5*u);
      r = max(length(p.xz), 3.0);
    }
    float phiv = atan(p.z, p.x);
    vec3 v = vec3(-sin(phiv), 0.0, cos(phiv));
    vec2 dp = doppler(p, v, sqrt(0.5/max(r, 3.0)));
    float dopp = pow(max(dp.x, 0.0), 0.5);
    vec3 ember = vec3(1.0, 0.42, 0.24), clean = vec3(0.45, 0.66, 1.0);
    vec3 col = mix(clean, ember, uHeat);
    float endFade = smoothstep(uTail, uTail + 6.0, q) * (1.0 - smoothstep(uHead - 3.0, uHead, q));
    float I = (0.55 + 0.45*hash(aSeed)) * dopp * uStrandGain * uGain * mix(0.55, 1.0, uHeat) * endFade;
    vec3 hv = holeView();
    vec3 pv = (modelViewMatrix * vec4(p, 1.0)).xyz;
    float ok; vec3 lv = lens(pv, hv, 0.0, ok);
    emit(lv, col, I, 1.7, vis*ok);
  }
`;

const CONV_VERT = COMMON + /* glsl */`
  attribute float aLine, aU0, aSeed;
  uniform float uConv;
  uniform vec3 uSrc[6];
  void main(){

const N_DISK = 26000;
{
  const aR = new Float32Array(N_DISK), aPhi = new Float32Array(N_DISK), aH = new Float32Array(N_DISK), aB = new Float32Array(N_DISK), aS = new Float32Array(N_DISK);

const N_JET = 7000;

{

  const rest = (1 - 0.72 * st.single);
  shared.uGain.value = 1;
  diskMat.uniforms.uDiskGain.value = diskMat2.uniforms.uDiskGain.value = show.disk ? look.diskBrightness * lampHole * rest : 0;
  jetMat.uniforms.uJetLen.value = look.jetLength; jetMat.uniforms.uJetW.value = look.jetWidth;
  jetMat.uniforms.uJetGain.value = show.jets ? lampHole * rest : 0;
  knotMat.uniforms.uKnotGain.value = show.knots && show.jets ? lampHole * rest : 0;
  const minI = (look.jetLength / KNOT_V) / (KNOT_SLOTS - 0.5) * 1.05;
  knotMat.uniforms.uKnotI.value = look.knotRate > 0.01 ? Math.max(1 / look.knotRate, minI) : 1e6;
  ringMat.uniforms.uRingGain.value = show.archRing ? lampHole * rest : 0;
  diskMat2.uniforms.uDiskGain.value *= show.archRing ? 1 : 0;
  bgMat.uniforms.uBgGain.value = lampRest * rest;
  infallMat.uniforms.uInfallGain.value = show.infall ? lampHole * rest : 0;
  convMat.uniforms.uConv.value = st.converge;
  const head = -STRAND.lin + st.strand * (STRAND.lin + STRAND.lstr);
  strandMat.uniforms.uHead.value = show.strand && st.strand > 0 ? head : -1e9;
  strandMat.uniforms.uTail.value = head - STRAND.lstr;
  strandMat.uniforms.uHeat.value = st.heat;
  strandMat.uniforms.uStrandGain.value = look.strandBrightness * lampHole * (1 + 0.9 * st.single);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
setScene(0);
requestAnimationFrame(tick);

// Deterministic hooks for screenshots (no query strings; on-page buttons do the same).
window.__bh = {
  scene: i => setScene(i),
  seek: p => { play.t = p * SCENES[play.scene].dur; play.playing = false; updateTransport(); },
  playing: v => { play.playing = v; updateTransport(); },
  ambient: t => { ambient = t; },
  framing: v => { view.framing = v ? 1 : 0; if (v) Object.assign(view, DEFAULT_VIEW); $('framing').classList.toggle('on', !!v); },
  band: v => { view.band = !!v; bandEl.classList.toggle('show', view.band); $('bandToggle').classList.toggle('on', view.band); },
  values: () => JSON.parse(valuesJSON()),
  setLook: o => { Object.assign(look, o); for (const k in o) if (sliderInputs[k]) { sliderInputs[k].inp.value = look[k]; sliderInputs[k].fmt(); } },
  frames: () => renderer.info.render.frame,
};
</script>
