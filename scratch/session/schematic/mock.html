<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Schematic mocks</title>
<style>
  :root { --bg: #0b0d12; --ink: #d8dce6; --dim: #8a90a0; --line: rgba(216,220,230,0.14); --panel: rgba(11,13,18,0.78); --accent: #4da3ff; color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); overflow: hidden; height: 100%; }
  body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; background: var(--bg); touch-action: pan-y; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; background: rgba(216,220,230,0.08); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  button.on { background: rgba(77,163,255,0.22); border-color: rgba(77,163,255,0.6); }
  #band { position: fixed; left: 0; right: 0; top: 0; height: 42%; background: rgba(11,13,18,0.82); border-bottom: 1px dashed rgba(216,220,230,0.35); display: none; align-items: flex-end; padding: 0 22px 26px; box-sizing: border-box; pointer-events: none; }
  #band.show { display: flex; }
  #band p { margin: 0; font-family: Georgia, serif; font-size: 19px; line-height: 1.45; max-width: 34em; }
  #band p.empty { color: var(--dim); font-style: italic; font-size: 15px; }
  #band .tag { position: absolute; bottom: 6px; right: 10px; font-size: 11px; color: var(--dim); }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #top h1 { margin: 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  #top .right { display: flex; gap: 6px; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(11,13,18,0), rgba(11,13,18,0.75)); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
  #bottom.hidden { display: none; }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row button { flex: 0 0 auto; }
  #info { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  #desc { color: var(--ink); font-size: 12px; max-width: 42em; }
  @media (min-width: 900px) { #bottom { max-width: 560px; margin-left: auto; margin-right: 12px; } }
</style>

<div id="stage"></div>
<div id="band"><span class="tag">text band, top 42 %</span><p class="empty">text band (empty in the mock)</p></div>
<div id="top"><h1>Schematic mocks · swipe to change concept</h1><div class="right"><button id="bandBtn">band</button><button id="uiBtn">ui</button></div></div>

  <div class="row" id="zoomRow" style="display:none;align-items:center;gap:10px"><span style="color:var(--dim);font-size:11px">hood</span><input id="zoom" type="range" min="0" max="1" step="0.001" style="flex:1;accent-color:#8fe3c8"><span style="color:var(--dim);font-size:11px">close</span></div>
  <div id="desc"></div>
  <div id="info"></div>
</div>

<script type="module">

  'RH0': { name: 'R + H (old)', desc: 'The round-3 hand-over for comparison: H fades out and R fades in over 220 → 320 px, with the level-of-detail switches as they were.' },
  'E': { name: 'E · placeholders', desc: 'Plan: faint wireframe outlines of the bodies the plan intends, at their intended places and sizes. The defect: the body does not fit its outline; the outline stays.' },
  'F': { name: 'F · construction', desc: 'Plan: a centre mark, radius lines, compass tick-arcs and dimension lines with tick ends and a planned value. The defect: a second, ember dimension to where the body really is.' },
  'G': { name: 'G · tolerance bands', desc: 'Plan: each orbit is a thin band of allowed range. Healthy bodies sit inside. The defect: the body is outside, and the band edge goes ember where it crossed. No counters anywhere.' },
  'H': { name: 'H · mission plan', desc: 'Plan: orbits as planned trajectories: dashed forward arcs, node markers where a body should be, direction arrows. The defect: the body is off its node and its arc deviates, in ember.' },
  'B2': { name: 'B′ · design hologram', desc: 'B without the sweep, the brackets and the counts: a glassy design-tool wireframe with the plane, planned stalks and one planned dimension.' },
  'C2': { name: 'C′ · engineering', desc: 'C without anything that monitors: dial rings, graduations, a tick where each body is planned, and the table of planned radii. The defect is only geometry: an ember tick where the body really is.' },
  'R': { name: 'R · recommended', desc: 'B′ plane and stalks + C′ dial graduations + E placeholders + G bands + one F dimension (two when the body is off plan). Bolder dots.' },
  'T': { name: 'today', desc: 'The built look: self-lit star, dotted blue orbits, lattice planets. No schematic.' },
  'A': { name: 'A · console panel', desc: 'bridge-console-flavoured: a thick elbow frame of dot rows, pastel segments, decorative numeral blocks, orbits as capped arcs.' },
  'B': { name: 'B · holo map', desc: 'space-opera holo map: a faint ground grid, stalks from the plane to each body, a scan sweep, brackets and two data tags.' },
  'C': { name: 'C · engineering', desc: 'Minimal readout: bone-white dial rings with ticks at each body, corner brackets on the star, one numeric block.' },
  'D': { name: 'D · dial + tag', desc: 'Hybrid: phosphor dial rings and ticks, one sweep, one data tag with a leader line, a title block of numeral texture, a ghost marker where the plan puts the code.' },

const FRAMINGS = { close: 'one system', hood: 'neighbourhood', zoom: 'zoom (slider)' };

// ---------- colours ----------
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });

const VERT = `

const sceneH = new THREE.Scene(); sceneH.add(hud.points);
const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
const camH = new THREE.OrthographicCamera(0, 1, 0, 1, -1, 1);
let W = 1, H = 1;

function resize() {

  renderer.setSize(W, H, false);

// ---------- projection helpers ----------
const _v = new THREE.Vector3();

// ---------- camera framings ----------
const CAM = {
  close: { dist: [56, 36], el: 28, az: -24, want: [0.70, 0.68] },
  hood: { dist: [250, 230], el: 42, az: 12, want: [0.71, 0.72] },

// ---------- world draws ----------
function background() {

  }

  // ----- full detail -----
  const rOut = sys.planets[sys.planets.length - 1].r;
  const focus = B[focusIdx] || B[1];
  const focusEmber = focus.pl.state === 'ember';
  const glitch = focusEmber ? 0.25 + 0.2 * Math.sin(t * 13) : 0;

    // the frame: a vertical bar down the left from under the band, an elbow, a horizontal bar along the bottom in segments
    const x0 = 16, yTop = bandBottom() + 14, yBot = H - (P.ui ? 150 : 30);
    bar(x0 + 4, yTop, x0 + 4, yBot - 18, 4, 2, MINT, 0.75);

    numeralTexture(x0 + 26, yBot - 30, 9, 2, 1.25, MINT, 0.55, 5);
    numeralTexture(x0 + 150, yBot - 30, 11, 2, 1.25, TEAL, 0.55, 9);
    glyphs(`${sys.planets.length}`, x0 + 26, yTop + 2, readP, MINT, 0.9);
    // a readable readout on the focused body: its ring's radius, as a pill tag
    const [fx, fy] = project(...focus.ap);
    const [tx, ty] = placeTag(fx, fy, [fmt(focus.pl.r)], readP, P.ui ? 170 : 40, focus.px / 2 + 22);
    tag(fx, fy, tx, ty, [fmt(focus.pl.r)], readP, focusEmber ? EMBER : LILAC, 0.9, glitch, 3);
  }

  if (c === 'B') {
    grid(sys.p, 20, 5, 7, ui, 0.2);
    for (const pl of sys.planets) ring(sys.p, pl.r, 5, ui, 0.42, 1.3);

    // the scan sweep on the ambient clock

    const [fx, fy] = project(...focus.ap); const bpx = Math.max(focus.px, 28) + 14;
    bracket(fx, fy, bpx, bpx, 7, 2.2, focusEmber ? EMBER : ui, 0.9);
    // two tags: the star's, and the focused body's
    const starLines = [`${sys.planets.length}`, fmt(sys.bright, 2)];
    const [sxT, syT] = placeTag(sx + 40, sy - 60, starLines, readP, P.ui ? 170 : 40);
    tag(sx, sy, sxT, syT, starLines, readP, ui, 0.85);
    const lines = [fmt(focus.pl.r), `${focus.pl.moons.length}`];
    const [tx, ty] = placeTag(fx, fy + 10, lines, readP, P.ui ? 170 : 40, bpx / 2 + 18);
    tag(fx, fy, tx, ty, lines, readP, focusEmber ? EMBER : ui, 0.9, glitch, 11);
    if (focusEmber) triangle(fx, fy - bpx / 2 - 14, 11, 2.2, EMBER, Math.sin(t * 9) > -0.2 ? 0.95 : 0.4);

      const e = b.pl.state === 'ember';
      tick(sys.p, b.pl.r, a, 1.2, 4, e ? EMBER : ui, 0.8);

      if (e) { const g = b.ap; tick(sys.p, Math.hypot(g[0] - sys.p[0], g[2] - sys.p[2]), Math.atan2(g[2] - sys.p[2], g[0] - sys.p[0]), 1.2, 4, ui, 0.5); }

    const px0 = 18, py0 = H - (P.ui ? 150 : 30) - 9 * readP * sys.planets.length;
    let yy = py0;
    sys.planets.forEach((pl, i) => {
      const e = pl.state === 'ember'; const val = e ? pl.r + 0.4 * Math.abs(Math.sin(t * 2.3 + pl.r)) : pl.r;

  if (c === 'D') {
    for (const pl of sys.planets) ring(sys.p, pl.r, 6, ui, 0.3, 1.2);

    numeralTexture(bx, by, 7, 3, 1.5, ui, 0.55, 7);
    glyphs(`${sys.planets.length}`, bx, by + 24, readP, ui, 0.85);
    // one data tag on the focused body
    const [fx, fy] = project(...focus.ap);
    const dl = [fmt(focusEmber ? focus.pl.r + 0.4 * Math.abs(Math.sin(t * 2.3)) : focus.pl.r), `${focus.pl.moons.length}`];
    const [tx, ty] = placeTag(fx, fy + 12, dl, readP, P.ui ? 170 : 40, focus.px / 2 + 24);
    tag(fx, fy, tx, ty, dl, readP, focusEmber ? EMBER : ui, 0.9, glitch, 13);

  }

}

// ---------- round 2: the plan concepts (prescriptive marks only; nothing sweeps, counts or blinks) ----------
function drawPlan(sys, t, B, lod, c, focusIdx) {
  const ui = PHOSPHOR; const full = lod === 'full'; const readP = 2.5;

  const rOut = sys.planets[sys.planets.length - 1].r;

  const uiPad = P.ui ? 170 : 40;
  // rings or bands. Low detail: the outer ring only; mid: every ring, thin; full: rings or bands
  const drawn = full ? B : lod === 'mid' ? B : [B[B.length - 1]];
  for (const b of drawn) {

    if (c === 'G' || c === 'R') band(sys.p, b.pl.r, 0.45, 5, ui, (c === 'G' ? 0.6 : 0.5) * bold, 1.4 * bold);

  if ((c === 'C2' || c === 'R') && full) graduations(sys.p, rOut + 1.2, ui, 0.55 * bold);
  if (c === 'F' || c === 'R') centreMark(sys.p, ui, (full ? 0.8 : 0.5) * bold);
  if (c === 'B2' && full) grid(sys.p, 20, 5, 7, ui, 0.22);
  for (const b of B) {
    const e = b.pl.state === 'ember'; const aP = ang(sys.p, b.pp), aA = ang(sys.p, b.ap); const rA = Math.hypot(b.ap[0] - sys.p[0], b.ap[2] - sys.p[2]);
    if (c === 'B2' || c === 'R') { if (lod !== 'low') stalk(sys.p, b.pp, ui, (full ? 0.6 : 0.45) * bold); if (e) stalk(sys.p, b.ap, EMBER, 0.9); }
    if (c === 'E' || c === 'R') {
      outline(b.pp, b.pl.R, sys.p, ui, (full ? 0.75 : 0.6) * bold, full);
      if (full) for (const mo of b.pl.moons) outline(moonPos(b.pp, b.pl, mo, t), 0.22, sys.p, ui, 0.55 * bold, false);
    }
    if (c === 'F') {
      if (lod !== 'low') segment3(sys.p, b.pp, 5, ui, full ? 0.3 : 0.4, 1.1);                  // the radius line
      if (full) { ring(sys.p, b.pl.r + 0.25, 3, ui, 0.6, 1.2, { arc: [aP - 0.1, 0.2] }); ring(sys.p, b.pl.r - 0.25, 3, ui, 0.6, 1.2, { arc: [aP - 0.1, 0.2] }); }   // compass tick-arcs
      if (e) segment3(sys.p, b.ap, 4, EMBER, 0.9, 1.3);

    if (c === 'G' || c === 'R') { if (e) emberEdge(sys.p, b.pl.r + 0.45, aA, full ? 0.3 : 0.4, full ? 2.0 : 1.8); }
    if (c === 'H') { trajectory(sys.p, b.pl.r, aP, ui, full ? 0.7 : 0.6, lod !== 'low'); if (e) deviation(sys.p, b.ap, EMBER, lod !== 'low'); }
    if (c === 'C2') { tick(sys.p, b.pl.r, aP, 1.2, 4, ui, full ? 0.85 : 0.7); if (e) tick(sys.p, rA, aA, 1.2, 4, EMBER, 0.95, 1.6); }
  }

  const fe = focus.pl.state === 'ember'; const aP = ang(sys.p, focus.pp), aA = ang(sys.p, focus.ap); const rA = Math.hypot(focus.ap[0] - sys.p[0], focus.ap[2] - sys.p[2]);

    if (fe) dimension(sys.p, rA, aA, fmt(rA), EMBER, 0.95, readP, 1 + 2.6 / rA, 0);   // its value past the body, beyond the extension line
  }

    const px0 = 18, py0 = H - uiPad - 9 * readP * sys.planets.length; let yy = py0;
    sys.planets.forEach((pl, i) => { glyphs(`${i + 1} ${fmt(pl.r)}`, px0, yy, readP, ui, 0.9); yy += 9 * readP; });
    const [ox, oy] = project(...onRing(sys.p, rOut, Math.PI * 0.75));
    hline(px0 + 6 * readP * 6 + 4, py0 - 4, px0 + 6 * readP * 6 + 4, yy - 2 * readP, 4, ui, 0.5, 1.1); hline(px0 + 6 * readP * 6 + 4, py0 - 4, ox, oy, 4, ui, 0.35, 1.1);
  }

    const [fx, fy] = project(...focus.pp); const lines = [fmt(focus.pl.r)];
    const [tx, ty] = placeTag(fx, fy, lines, readP, uiPad, focus.px / 2 + 22); tag(fx, fy, tx, ty, lines, readP, ui, 0.95);
  }
}

// ---------- round 4: R + H as one geometry, staggered by element over the system's projected diameter (CSS px) ----------
const WINDOWS = {
  ringOuter: [40, 80], ringsInner: [110, 170], nodes: [60, 110], chev: [90, 130],
  close: [150, 230], goChev: [150, 210], peel: [200, 300], stalk: [220, 300], node2out: [240, 320],

function drawRH(sys, t, B, D, g, focusIdx) {

  const F = (k) => smooth(WINDOWS[k][0], WINDOWS[k][1], D);
  const Wn = { ringOuter: F('ringOuter'), ringsInner: F('ringsInner'), nodes: F('nodes'), chev: F('chev'), close: F('close'), goChev: 1 - F('goChev'),
    peel: F('peel') * g, stalk: F('stalk') * g, node2out: F('node2out') * g, wire: F('wire') * g, grads: F('grads') * g, centre: F('centre') * g, dimLine: F('dimLine') * g, dimNum: F('dimNum') * g };
  const last = B.length - 1; const focus = B[focusIdx] || B[0]; const rOut = sys.planets[last].r;

    if (hw > 0) { rank(fr, 111 + i); ring(c0, b.pl.r - hw, 5, ui, 0.5 * Wn.peel, 1.4); ring(c0, b.pl.r + hw, 5, ui, 0.5 * Wn.peel, 1.4); rankOff(); }

  if (Wn.centre > 0) ring(c0, 1.3 * Wn.centre, 4, ui, 0.6 * Wn.centre, 1.1);
  B.forEach((b, i) => {
    const e = b.pl.state === 'ember'; const aP = ang(c0, b.pp); const r = b.pl.r;
    if (Wn.nodes > 0) {

      // the node at the body grows into its outline

      if (m > 0) { const bppu = pxPerUnit(...b.pp); const rpx = (b.pl.R * bppu + 2) * m; const [x, y] = project(...b.pp); const nf2 = Math.max(6, 2 * Math.PI * rpx / 4); const n2 = Math.floor(nf2); for (let k = 0; k <= n2; k++) { const aa = k / nf2 * 2 * Math.PI; hdot(x + rpx * Math.cos(aa), y + rpx * Math.sin(aa), 1.4, ui, 0.75 * m * (k === n2 ? nf2 - n2 : 1)); } }

      const r0 = rA + (r + 0.45 - rA) * pe; const spanE = 1.2 - 0.6 * pe; const grow = 0.8 * (1 - pe); const a0 = aA - 0.3 * pe;
      const nf = Math.min(2400, spanE * r0 * ppu / 3); const n = Math.floor(nf);
      for (let k = 0; k <= n; k++) { const u = k / nf; const gap = k % 11 >= 7; const al = 0.95 * (gap ? pe : 1) * (k === n ? nf - n : 1) * Wn.nodes; if (al <= 0.002) continue; world.add(...onRing(c0, r0 + grow * u, a0 + spanE * u), 1.5 + 0.5 * pe, EMBER, al); }
      if (pe < 1) { const tip = onRing(c0, r0 + grow, a0 + spanE); const tang = a0 + spanE + Math.PI / 2; for (const sgn of [1, -1]) { const bb = [tip[0] - 0.7 * Math.cos(tang + sgn * 0.6), tip[1], tip[2] - 0.7 * Math.sin(tang + sgn * 0.6)]; segment3(tip, bb, 3, EMBER, 0.9 * (1 - pe) * Wn.nodes, 1.3); } }
      if (Wn.stalk > 0) { const foot = [b.ap[0], c0[1], b.ap[2]]; const top = [foot[0], foot[1] + (b.ap[1] - foot[1]) * Wn.stalk, foot[2]]; segment3(foot, top, 4, EMBER, 0.9 * Wn.stalk, 1.1); }
    }
  });
  // the dimension: its line draws from the centre, then the tick and extension, then the value; the second one for a body off plan
  if (Wn.dimLine > 0) {
    const aP = ang(c0, focus.pp); const fe = focus.pl.state === 'ember';
    dimensionM(c0, focus.pl.r, aP, fmt(focus.pl.r), ui, 0.95, readP, 0.5, 1, Wn.dimLine, Wn.dimNum, 161);
    if (fe) { const aA = ang(c0, focus.ap); const rA = Math.hypot(focus.ap[0] - c0[0], focus.ap[2] - c0[2]); dimensionM(c0, rA, aA, fmt(rA), EMBER, 0.95, readP, 1 + 2.6 / rA, 0, Wn.dimLine, Wn.dimNum, 171); }
  }
}

// ---------- frame ----------
let dirty = true; let t0 = performance.now(); let heroPx = 0; let lastStats = { schem: 0, bright: 0 };
function draw() {
  const t = P.t ?? (performance.now() - t0) / 1000;
  frameCamera();
  world.begin(); hud.begin();
  background();
  let schem = 0;
  // at most two systems at full detail: a system's full-detail gain is its lead over the third largest, smoothed over ±24 px (the essay's FULL_DETAIL_SOFT idea), so a system leaving the top two fades rather than snaps
  const sizes = SYSTEMS.map((s) => sysPxOf(s)); const third = [...sizes].sort((a, b) => b - a)[2] ?? 0;
  let bright = 0;
  SYSTEMS.forEach((s, i) => {
    if (P.solo && P.framing === 'zoom' && i !== 12) return;
    const w0 = world.n, h0 = hud.n;
    schem += drawSystem(s, t, 1, third > 0 ? smooth(-24, 24, sizes[i] - third) : 1);
    for (let k = w0; k < world.n; k++) bright += world.alpha[k] * world.size[k] * world.size[k];
    for (let k = h0; k < hud.n; k++) bright += hud.alpha[k] * hud.size[k] * hud.size[k];
  });
  lastStats = { schem, bright };
  if (P.framing === 'zoom') heroPx = sysPxOf(SYSTEMS[12]);
  // the neighbourhood's one readout: the count of flagged systems (a number true of what is on screen)
  if (P.framing === 'hood' && ['A', 'B', 'D'].includes(P.concept)) {
    const n = SYSTEMS.reduce((k, s) => k + (s.state === 'ember' ? 1 : 0) + s.planets.filter((p) => p.state === 'ember').length, 0);
    if (n > 0) { const col = UI_OF[P.concept]; glyphs(`${n}`, W - 16 - 6 * 2.5 * String(n).length, H - (P.ui ? 160 : 36), 2.5, EMBER, 0.9); }
  }
  world.end(); hud.end();
  renderer.autoClear = true; renderer.render(sceneW, cam);
  renderer.autoClear = false; renderer.render(sceneH, camH);
  info.textContent = `${CONCEPTS[P.concept].name} · ${FRAMINGS[P.framing]} · ${STATES[P.state]} · ${W}×${H} @${P.dpr} · dots ${world.n + hud.n} (schematic ${schem})` + (P.framing === 'zoom' ? ` · zoom ${P.zoom.toFixed(3)} · hero ${heroPx.toFixed(0)} px` : '');
}
function loop() { if (P.t === null || dirty) { draw(); dirty = false; } requestAnimationFrame(loop); }

// ---------- ui ----------
const info = document.getElementById('info'), desc = document.getElementById('desc');
function chips(el, map, key, apply) {
  el.innerHTML = '';
  for (const [k, v] of Object.entries(map)) { const b = document.createElement('button'); b.textContent = typeof v === 'string' ? v : v.name; b.className = P[key] === k ? 'on' : ''; b.onclick = () => { P[key] = k; apply(); sync(); }; el.appendChild(b); }
}
function sync() {
  chips(document.getElementById('concepts'), CONCEPTS, 'concept', () => {});
  chips(document.getElementById('framings'), FRAMINGS, 'framing', buildModel);
  chips(document.getElementById('states'), STATES, 'state', buildModel);
  desc.textContent = CONCEPTS[P.concept].desc;
  document.getElementById('band').classList.toggle('show', P.band);
  document.getElementById('zoomRow').style.display = P.framing === 'zoom' ? 'flex' : 'none'; zoomEl.value = P.zoom;
  document.getElementById('bottom').classList.toggle('hidden', !P.ui);
  document.getElementById('top').style.display = P.ui ? '' : 'none';
  try { const u = new URL(location); u.searchParams.set('c', P.concept); u.searchParams.set('f', P.framing); u.searchParams.set('s', P.state); history.replaceState(null, '', u); } catch (e) { /* framed pages may refuse */ }
  dirty = true;
}
const zoomEl = document.getElementById('zoom');
zoomEl.oninput = () => { P.zoom = parseFloat(zoomEl.value); dirty = true; try { const u = new URL(location); u.searchParams.set('z', P.zoom.toFixed(3)); history.replaceState(null, '', u); } catch (e) { /* framed pages may refuse */ } };
stage.addEventListener('wheel', (e) => { if (P.framing !== 'zoom') return; e.preventDefault(); P.zoom = Math.min(1, Math.max(0, P.zoom - e.deltaY * 0.0012)); zoomEl.value = P.zoom; dirty = true; }, { passive: false });
document.getElementById('bandBtn').onclick = () => { P.band = !P.band; sync(); };
document.getElementById('uiBtn').onclick = () => { P.ui = !P.ui; sync(); };
// swipe between concepts, camera held still
let sx0 = null; const ORDER = Object.keys(CONCEPTS);
stage.addEventListener('pointerdown', (e) => { sx0 = e.clientX; });
stage.addEventListener('pointerup', (e) => { if (sx0 === null) return; const dx = e.clientX - sx0; sx0 = null; if (Math.abs(dx) < 40) return; const i = ORDER.indexOf(P.concept); P.concept = ORDER[(i + (dx < 0 ? 1 : ORDER.length - 1)) % ORDER.length]; sync(); });
window.addEventListener('keydown', (e) => { const i = ORDER.indexOf(P.concept); if (e.key === 'ArrowRight') { P.concept = ORDER[(i + 1) % ORDER.length]; sync(); } if (e.key === 'ArrowLeft') { P.concept = ORDER[(i + ORDER.length - 1) % ORDER.length]; sync(); } });

resize(); if (P.px !== null) P.zoom = zoomForPx(P.px); buildModel(); sync(); loop();
window.__mock = { P, draw, buildModel, sync, zoomForPx, HANDOVER, stats: () => lastStats, WINDOWS };
</script>
