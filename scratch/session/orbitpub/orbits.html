      const SICK = q.get('derp') !== '0';
      const AMBIENT0 = q.has('ambient') ? Number(q.get('ambient')) : null; // a frozen ambient clock (stills, tests)

        if (!d.scatter) { if (rec.scatOn) { arr.set(sc.base); rec.shell.geometry.attributes.position.needsUpdate = true; rec.scatOn = false; rec.mesh.material.uniforms.uFill.value = 0.035; } return; }
        const { s, k } = d.scatter; const sec = s * DERP.dur;
        const hs = (j) => hash01(n.seed ^ 0x5ee9, k * 16 + j); const sw = [hs(0) - 0.5, hs(1) - 0.5, hs(2) - 0.5]; const Lw = Math.hypot(...sw) || 1; sw[0] /= Lw; sw[1] /= Lw; sw[2] /= Lw;
        const after = hs(3) < 0.5; const jq = Math.floor(sec * 30);
        let anyOut = false;
        for (let i = 0; i < sc.shellN; i++) {

      // the orbit's frame: a point at polar (rad, a) in the orbit plane, the plane tilted by tr.tilt about the axis at azimuth tr.az
      function orbitXYZ(tr, rad, a, up) { const x = rad * Math.cos(a), z = rad * Math.sin(a); const ca = Math.cos(tr.az), sa = Math.sin(tr.az); const ct = Math.cos(tr.tilt), st = Math.sin(tr.tilt); const along = x * ca + z * sa; const px = x - along * ca, pz = z - along * sa; return [along * ca + px * ct, (sa * px - ca * pz) * st + up, along * sa + pz * ct]; }

      }
      function addNode(layer, parent, orbitR, phase, period, extra = {}) {

      }

      const gauss = () => { const u = Math.max(1e-6, rng()), v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

        planet: () => clamp(0.22 * Math.exp(0.5 * gauss()), 0.14, 0.5),               // log-normal: many small, a few large
        moon: (Rp) => clamp(0.12 * Rp * Math.exp(0.45 * gauss()), 0.04, 0.35 * Rp),    // never more than 0.35 of its planet
        moons: () => (rng() < 0.45 ? 0 : Math.min(6, 1 + Math.floor(-Math.log(Math.max(1e-6, rng())) / 0.7))), // most bare, a few with several
        planets: () => 2 + Math.floor(8 * rng() * rng()),                                // 2-9, most 2-5
        tracks: [1.3, 1.9, 2.5],                                                         // moon tracks, in planet radii
      };
      // a planet's moons: on tracks relative to the planet's radius, two per track at most, sizes seeded

      }

      function layoutHood() {

        const spots = [[0, 0, 0], [-24, 0, 10], [22, 0, -12], [-8, 0, -26], [28, 0, 16], [-30, 0, -14], [12, 0, 30], [-36, 0, 22], [38, 0, -4], [6, 0, -40], [-16, 0, 40], [34, 0, 34]];
