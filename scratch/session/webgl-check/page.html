<!doctype html><html><body style="margin:0;background:#0b0d12"><canvas id=c width=480 height=320></canvas><pre id=o style="color:#ddd"></pre>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl2');const out={};
if(!gl){out.webgl2=false}else{
 out.webgl2=true;const d=gl.getExtension('WEBGL_debug_renderer_info');
 out.renderer=d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
 out.pointSizeRange=Array.from(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE));
 out.maxVertexUniformVectors=gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS);
 out.colorBufferFloat=!!gl.getExtension('EXT_color_buffer_float');
 const vs=`#version 300 es
 in vec2 p; out vec3 col; void main(){ float i=float(gl_InstanceID); vec2 o=vec2(mod(i,40.)-20.,floor(i/40.)-12.)*0.045; gl_Position=vec4(p*0.012+o,0,1); col=mix(vec3(1,.6,.2),vec3(.3,.6,1),fract(i*0.37)); }`;
 const fs=`#version 300 es
 precision highp float; in vec3 col; out vec4 f; void main(){ f=vec4(col,1); }`;
 const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
 gl.clearColor(.04,.05,.07,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(pr);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,1000);
 out.instancedQuadsDrawn=1000;}
document.getElementById('o').textContent=JSON.stringify(out,null,1);window.__out=out;
</script></body></html>
