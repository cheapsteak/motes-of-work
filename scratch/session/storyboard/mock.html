<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard mock</title>
<link rel="stylesheet" href="/home/user/motes-of-work/.superpowers/sdd/2026-10-03-plan-3-bicycle/fonts/literata.css">
<link rel="stylesheet" href="/home/user/motes-of-work/.superpowers/sdd/2026-10-03-plan-3-bicycle/fonts/instrument.css">
<style>
:root {
  --bg: #0b0d12; --ink: #e8e6ee; --ink-dim: #9f9dab; --agent: #4da3ff;
  --gutter: clamp(1rem, 5vw, 4rem); --measure: 34rem; --text-top: 9vh;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body {
  font: 400 1.1875rem/1.55 'Literata', Georgia, serif; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-shadow: 0 1px 2px rgba(11,13,18,.9), 0 0 14px rgba(11,13,18,.95), 0 0 30px rgba(11,13,18,.8);
}
/* The captured canvas frame, shifted to simulate the new camera framing (machine centred, low). */
#stage { position: fixed; inset: 0; background: var(--bg) var(--frame) var(--fx, 0) var(--fy, 0) / auto no-repeat; }
/* Vignette, centre moved down. */
#vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 62%, transparent 55%, rgba(0,0,0,.45) 100%); }
/* Soft top scrim: the text band. */
#scrim { position: fixed; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(11,13,18,.72) 0, rgba(11,13,18,.45) 22svh, rgba(11,13,18,0) 42svh); }
.panel { position: absolute; top: var(--text-top); left: 50%; transform: translateX(-50%);
  width: min(var(--measure), calc(100vw - 2 * var(--gutter))); display: grid; }
.page { grid-area: 1 / 1; }
.beat { opacity: var(--reveal, 1); color: color-mix(in oklab, var(--ink), var(--ink-dim) calc(var(--dim, 0) * 100%)); }
.beat p { margin: 0 0 .85em; }
.beat:last-child p:last-child { margin-bottom: 0; }
.brief-ask { margin: 0 0 .5rem; font: italic 400 1.8rem/1.2 'Instrument Serif', serif; letter-spacing: .005em; }
ul.brief { margin: 0; padding: 0; list-style: none; font-size: 1.0625rem; line-height: 1.45; }
ul.brief > li { padding: .42rem 0; color: var(--ink-dim); }
ul.brief > li[data-met] { color: var(--ink);
  text-shadow: 0 0 10px rgba(77,163,255,.5), 0 1px 2px rgba(11,13,18,.9), 0 0 14px rgba(11,13,18,.95); }
body[data-view="portrait"] { font-size: 1.0625rem; }
body[data-view="portrait"] .panel { --text-top: calc(env(safe-area-inset-top) + 7svh); left: 16px; right: 16px; width: auto; transform: none; }
body[data-view="portrait"] .brief-ask { font-size: 1.45rem; }
body[data-view="portrait"] ul.brief { font-size: 1rem; }
body[data-view="portrait"] ul.brief > li { padding: .34rem 0; }
/* A guide line at 42% of the height: the text band's floor. Mock only. */
#guide { position: fixed; left: 0; right: 0; top: 42%; border-top: 1px dashed rgba(255,80,80,.5); pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="scrim"></div>
<article class="panel" id="panel"></article>
<div id="guide"></div>
<script>
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'desktop';
const page = q.get('page') || 'brief';
document.body.dataset.view = view;
const frames = {
  desktop: { brief: ['desktop-p0.2.png', '-330px', '120px'], reveal: ['desktop-p0.36.png', '-340px', '40px'], spec: ['desktop-p0.95.png', '0px', '130px'] },
  portrait: { brief: ['portrait-p0.2.png', '0px', '150px'], reveal: ['portrait-p0.36.png', '0px', '170px'], spec: ['portrait-p0.95.png', '0px', '150px'] },
};
const [file, fx, fy] = frames[view][page];
const stage = document.getElementById('stage');
stage.style.setProperty('--frame', `url(frames/${file})`);
stage.style.setProperty('--fx', fx);
stage.style.setProperty('--fy', fy);
const pages = {
  brief: `<div class="page"><div class="beat document">
    <p class="brief-ask">Build me a bike for getting around town.</p>
    <ul class="brief">
      <li data-met>A comfy seat and handlebars, both adjustable to fit tall people and short people.</li>
      <li data-met>Two wheels. The pedals drive the back wheel through a chain.</li>
      <li>The front wheel turns, so you can steer.</li>
      <li>Hand brakes and a bell.</li>
      <li>Sturdy, but light enough to carry up the stairs.</li>
    </ul></div></div>`,
  reveal: `<div class="page">
    <div class="beat" style="--dim:1"><p>Now try to ride it.</p></div>
    <div class="beat"><p>The seat is on top of the steering post, over the front wheel. When the wheel turns, the seat turns with it.</p></div>
    <div class="beat" style="--reveal:0"><p>The handlebars are at the back, where the seat should be. They do not turn at all.</p></div>
  </div>`,
  spec: `<div class="page">
    <div class="beat" style="--dim:1"><p>The warm dots are where you looked closely: the parts a body touches.</p></div>
    <div class="beat"><p>The agent can build the rest later. Only you could say where a person goes.</p></div>
  </div>`,
};
document.getElementById('panel').innerHTML = pages[page];
</script>
</body>
</html>
