<!doctype html>

<title>Binary star mocks</title>
<style>

<div id="stage"></div>
<div id="band"><p>text band, top 42 % (empty in the mock)</p></div>
<div id="top"><h1>Binaries · swipe or ← → between options</h1><div class="right"><button id="planBtn">plan</button><button id="bandBtn">band</button><button id="uiBtn">ui</button></div></div>
<div id="nojs">Loading three.js…</div>

  <div class="row"><span id="options" style="display:flex;gap:6px"></span><button id="frameBtn" title="framing: neighbourhood or close"></button></div>

<script>
// ===================================================================================================
// MODEL BEGIN: pure. Every value is a function of the seeded hashes below; no Math.random anywhere.
// A port of the generator's slot, fit and placement rules (body.ts, generate.ts: drawSlot, layMoons,
// layOut, fitSystem, placeStars) at the same constants, plus the binary rules this experiment proposes.
// ===================================================================================================
const STAR_R = 0.9, PLANET_ORBIT_FIRST = 2.2, PLANET_ORBIT_MAX = 9.6, PLANET_MARGIN = 0.15, MOON_MARGIN_SHARE = 0.05, PLANET_E_MIN = 0.05, HOOD_MARGIN = 1;
const MOON_TRACK = [1.3, 1.9, 2.5], MOON_PERIOD = [6, 9, 12];
const STAR_COUNT = 30, SCRIPTED = 6;                     // the first six stand in for the story's scripted plans: never made binary
const HOOD_SPREAD = [45, 35], HOOD_CANDIDATES = 1500, HOOD_BOXES = [90, 130, 180, 240, 320];
const TRACK_DOTS = { planet: 90, moonTrack: 40 }, STAR_DOTS = 160, SPIKE_DOTS = 96;
// the experiment's knobs
const WIDE_K = 1.5;          // (b) and the singles of (c)/(d): two systems at least 1.5 x their combined outer radii apart
const PAIR_K = 1.35;         // a close pair: mutual nearest neighbours in today's packing, closer than 1.35 x their combined outer radii
const BIN_SHARE = 0.8, BIN_MAX = 4;   // of the close pairs (closest first), each kept with this seeded chance, at most this many
const BIN_A = [16, 26];      // an S-type pair's separation: today's distance, clamped to this (16 lets most stars keep two planets)
const BIN_E = [0.1, 0.4];    // and its eccentricity (wide binaries: roughly flat in e)
const P_GAP = 1.8;           // a P-type pair's least star separation (periapsis): two star radii plus a little, so the cores never merge
const P_E = [0.02, 0.12];    // a P-type pair's eccentricity (close binaries are near circular)
const P_FIRST = 1.08;        // a circumbinary planet's periapsis sits just outside the limit (x a_crit), the observed pile-up
const KEP = (60 + 18.75 * (5 - 2.4)) / Math.pow(5, 1.5);   // one Kepler constant, matched to planetPeriod at r = 5

function hash(i, salt) { let x = (i * 374761393 + salt * 668265263) >>> 0; x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0; return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function rngFor(key, salt) { let n = 0; return () => hash(key * 7919 + n++, salt); }
function gaussR(rng) { const u = 1 - rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

// ---- body.ts, as is ----
const planetCount = (u) => 2 + Math.floor(8 * u * u);
function planetOrbitRadii(n, rng) {
  const last = 5.5 + (4.1 * (n - 2)) / 7; if (n <= 1) return [PLANET_ORBIT_FIRST];
  const gaps = Array.from({ length: n - 1 }, () => 1 + 0.15 * (2 * rng() - 1)); const scale = (last - PLANET_ORBIT_FIRST) / gaps.reduce((s, x) => s + x, 0);
  const radii = [PLANET_ORBIT_FIRST]; for (let k = 0; k < n - 2; k++) radii.push(radii[k] + gaps[k] * scale); radii.push(last); return radii;
}
const planetRadius = (g) => clamp(0.22 * Math.exp(0.5 * g), 0.14, 0.5);
const moonCount = (u0, u1) => (u0 < 0.45 ? 0 : Math.min(6, 1 + Math.floor(-Math.log(Math.max(1e-6, u1)) / 0.7)));
const moonRadius = (Rp, g) => clamp(0.12 * Rp * Math.exp(0.45 * g), 0.04, 0.35 * Rp);
function moonTrack(i, n) { const c0 = Math.ceil(n / 3), c1 = Math.ceil((n - 1) / 3); return i < c0 ? 0 : i < c0 + c1 ? 1 : 2; }
const planetPeriod = (r) => 60 + 18.75 * (r - 2.4);
const BANDS = { planet: { e: [0.05, 0.22], tilt: 0.25, precession: [400, 900] }, moon: { e: [0.05, 0.12], tilt: 0.2, precession: [90, 200] } };
function orbitFor(kind, r, period, rng) {
  const b = BANDS[kind]; const e = b.e[0] + (b.e[1] - b.e[0]) * rng(); const tilt = b.tilt * (2 * rng() - 1); const tiltAz = 2 * Math.PI * rng(); const omega0 = 2 * Math.PI * rng();
  const precession = b.precession[0] + (b.precession[1] - b.precession[0]) * rng(); const phase = rng();
  return { r, a: r / (1 + e), e, tilt, tiltAz, omega0, precession, period, phase };
}
function latticeRowCols(rows, cols) { const out = []; for (let i = 0; i < rows; i++) { const lat = -Math.PI / 2 + (Math.PI * (i + 0.5)) / rows; out.push(Math.max(6, Math.round(cols * Math.cos(lat)))); } return out; }
const latticeCount = (rows, cols) => latticeRowCols(rows, cols).reduce((s, n) => s + n, 0);
const planetLattice = (R) => [Math.max(5, Math.round((14 * R) / 0.3)), Math.max(10, Math.round((36 * R) / 0.3))];
const moonLattice = (R, Rp, pl) => [Math.max(3, Math.round((pl[0] * R) / Rp)), Math.max(6, Math.round((pl[1] * R) / Rp))];

// ---- generate.ts: slots, moons, the fit ----
const slotReach = (s) => Math.max(s.R, s.ms);
function layMoons(slot) {
  const m = slot.moons.length; const onTrack = [0, 1, 2].map((t) => slot.moons.filter((_, j) => moonTrack(j, m) === t).length); const seen = [0, 0, 0];
  slot.moons.forEach((moon, j) => { moon.track = moonTrack(j, m); moon.orbit = { ...moon.orbit, phase: (slot.trackPhase[moon.track] + seen[moon.track]++ / onTrack[moon.track]) % 1 }; });
  const margin = MOON_MARGIN_SHARE * slot.R; let outer = slot.R;
  for (const t of [0, 1, 2]) {
    const on = slot.moons.filter((x) => x.track === t); if (on.length === 0) continue;
    const big = Math.max(...on.map((x) => x.R)); const el = slot.tracks[t];
    const r = Math.max(MOON_TRACK[t] * slot.R, ((outer + big + margin) * (1 + el.e)) / (1 - el.e));
    for (const x of on) x.orbit = { ...el, r, a: r / (1 + el.e), phase: x.orbit.phase };
    outer = r + big;
  }
  slot.ms = slot.moons.length > 0 ? outer : 0;
}
function drawSlot(key, k) {
  const prng = rngFor(key * 16 + k, 3);
  const R = planetRadius(gaussR(prng)); const own = prng(); const m = moonCount(own, prng());
  const orbit = orbitFor('planet', 1, 1, prng);
  const tracks = [0, 1, 2].map((t) => orbitFor('moon', 1, MOON_PERIOD[t], prng)); const trackPhase = [prng(), prng(), prng()];
  const moons = Array.from({ length: m }, (_, j) => { const t = moonTrack(j, m); return { R: moonRadius(R, gaussR(prng)), track: t, orbit: tracks[t] }; });
  const slot = { R, orbit, e0: orbit.e, moons, tracks, trackPhase, ms: 0, key, k };
  layMoons(slot); return slot;
}
const slotCount = (key) => planetCount(rngFor(key, 2)());
const drawSlots = (key) => Array.from({ length: slotCount(key) }, (_, k) => drawSlot(key, k));
function nominalRadii(key, n) { const rng = rngFor(key, 2); rng(); return planetOrbitRadii(n, rng); }
// layOut with two generalisations: the bound (a_crit for an S-type star) and the first orbit's inner clearance (a_crit for a P-type pair)
function layOut(slots, floors, ecc, maxR, inner0) {
  const radii = [];
  slots.forEach((s, k) => {
    const e = ecc(s.e0, k); const p = slots[k - 1];
    const inner = k === 0 ? inner0(s) : radii[k - 1] + Math.max(p.R + s.R + Math.max(p.ms, s.ms), slotReach(p) + slotReach(s));
    radii.push(Math.max(floors[k], ((inner + PLANET_MARGIN) * (1 + e)) / (1 - e)));
  });

}
function largestFit(fits) { if (fits(1)) return 1; let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; } return lo; }
// fitSystem: as the generator's (ease the eccentricities, then drop the outermost slots), with o.maxR, o.inner0, o.floors,
// o.least and o.eAdd (a forced eccentricity per slot, added on top of the band). o.strict: return null instead of flattening.
function fitSystem(key, all, o) {
  const maxR = o.maxR ?? PLANET_ORBIT_MAX, inner0 = o.inner0 ?? ((s) => STAR_R + slotReach(s)), least = o.least ?? 2, add = o.eAdd ?? [];
  const floorsFor = o.floors ?? ((n) => nominalRadii(key, n));
  const apply = (slots, radii, ecc) => { slots.forEach((s, k) => { const e = ecc(s.e0, k); s.orbit = { ...s.orbit, r: radii[k], e, a: radii[k] / (1 + e), period: planetPeriod(radii[k]) }; }); return slots; };
  const eased = (x) => (e0, k) => Math.min(0.4, PLANET_E_MIN + x * (e0 - PLANET_E_MIN) + (add[k] ?? 0));
  for (let n = all.length; n >= Math.min(least, all.length); n--) {
    const slots = all.slice(0, n); const floors = floorsFor(n);
    if (!layOut(slots, floors, eased(0), maxR, inner0)) continue;
    const x = largestFit((v) => layOut(slots, floors, eased(v), maxR, inner0) !== null);
    return apply(slots, layOut(slots, floors, eased(x), maxR, inner0), eased(x));
  }
  if (o.strict) return null;
  const slots = all.slice(0, least); const floors = slots.map((_, k) => (k === 0 ? PLANET_ORBIT_FIRST : 0)); const scaled = (x) => (e0) => x * e0;
  for (;;) {
    if (layOut(slots, floors, scaled(0), maxR, inner0)) { const x = largestFit((v) => layOut(slots, floors, scaled(v), maxR, inner0) !== null); return apply(slots, layOut(slots, floors, scaled(x), maxR, inner0), scaled(x)); }
    const free = slots.filter((s) => s.moons.length > 0); if (free.length === 0) throw new Error('does not fit');

}
const outerOf = (slots) => slots.reduce((m, s) => Math.max(m, s.orbit.r + slotReach(s)), STAR_R);

// ---- the stability limits (Holman & Wiegert 1999, AJ 117, 621: eqs. 1 and 3) ----
// S-type: the largest stable semi-major axis round a star, in units of the binary's a; mu = m_other / (m_host + m_other). Valid 0.1 <= mu <= 0.9, 0 <= e <= 0.8.
const hwS = (mu, e) => 0.464 - 0.380 * mu - 0.631 * e + 0.586 * mu * e + 0.150 * e * e - 0.198 * mu * e * e;
// P-type: the smallest stable semi-major axis round both, in units of the binary's a; mu = m2 / (m1 + m2). Valid 0.1 <= mu <= 0.9, 0 <= e <= 0.7.
const hwP = (mu, e) => 1.60 + 5.10 * e - 2.22 * e * e + 4.12 * mu - 4.27 * e * mu - 5.09 * mu * mu + 4.61 * e * e * mu * mu;
const kepPeriod = (a) => KEP * Math.pow(a, 1.5);

// ---- the stars ----
function makeStars() {
  return Array.from({ length: STAR_COUNT }, (_, key) => {
    const rng = rngFor(key, 5); const bright = 0.5 + 0.5 * rng(); const temp = rng();
    const mass = 0.5 + 0.7 * (bright - 0.5) / 0.5;    // a stand-in: the essay has no masses; the brighter star is the heavier
    const slots = fitSystem(key, drawSlots(key), { least: 2 });
    return { key, scripted: key < SCRIPTED, bright, temp, mass, slots, outer: outerOf(slots) };
  });
}

// ---- placeStars, in the arm's own frame (u along, v across); the galactic-radius band is left out ----
function place(units, gap, salt) {
  for (const box of HOOD_BOXES) {
    const placed = []; let ok = true;
    for (const u of units) {
      const rng = rngFor(u.key + 1000 * HOOD_BOXES.indexOf(box), salt); let best = null, bs = Infinity;
      for (let k = 0; k < HOOD_CANDIDATES; k++) {
        const cu = box * (2 * rng() - 1), cv = box * (2 * rng() - 1); const sc = (cu / HOOD_SPREAD[0]) ** 2 + (cv / HOOD_SPREAD[1]) ** 2;
        if (sc >= bs) continue;
        if (placed.every((o) => Math.hypot(cu - o.u, cv - o.v) >= gap(u, o))) { best = [cu, cv]; bs = sc; }
      }
      if (!best) { ok = false; break; }
      u.u = best[0]; u.v = best[1]; placed.push(u);
    }
    if (ok) return box;
  }
  throw new Error('no room');
}
const orderUnits = (units) => [...units].sort((a, b) => (a.scripted ? 0 : 1) - (b.scripted ? 0 : 1) || a.key - b.key);

// ---- the binaries ----
const toPlanet = (s) => ({ R: s.R, orbit: s.orbit, lattice: planetLattice(s.R), moons: s.moons.map((m) => ({ R: m.R, orbit: m.orbit, track: m.track })) });
// an S-type star's own planets, truncated at a_crit: the generator's fit with a_crit for 9.6 and its floors scaled in, at least one planet; the forced eccentricity
// (Heppenheimer 1978: e_F = 5/4 (a / a_B) e_B / (1 - e_B^2)) added to each, and the precession quickened as a planet nears the limit
function fitS(star, ac, ab, eb) {

  const floors = (n) => { const f = nominalRadii(star.key, n); const k = Math.min(1, (0.92 * ac) / f[n - 1]); return f.map((r) => r * k); };
  const fit = (add) => fitSystem(star.key, drawSlots(star.key), { least: 1, maxR: ac, strict: true, eAdd: add, floors });
  const first = fit([]); if (!first) return null;

  const slots = fit(add) ?? first;
  for (const s of slots) s.orbit = { ...s.orbit, precession: s.orbit.precession / (1 + 2 * Math.pow(s.orbit.r / ac, 3)) };
  return slots;
}
function buildS(A, B, d, key) {
  if (B.mass > A.mass) [A, B] = [B, A];
  const rng = rngFor(key, 9); const e = BIN_E[0] + (BIN_E[1] - BIN_E[0]) * rng(); const omega = 2 * Math.PI * rng(); const phase = rng();
  const M = A.mass + B.mass; const muA = B.mass / M, muB = A.mass / M;    // each star's perturber share

  const outer = Math.max(muA * ab * (1 + e) + outerOf(sa), muB * ab * (1 + e) + outerOf(sb));
  return { type: 'S', key, stars: [A, B], bin, outer, groups: [{ centre: 0, ac: acA, planets: sa.map(toPlanet) }, { centre: 1, ac: acB, planets: sb.map(toPlanet) }], dropped: A.slots.length + B.slots.length - sa.length - sb.length };

// a P-type pair: both stars' slots, interleaved, round the barycentre from just outside a_crit out to 9.6
function buildP(A, B, key) {
  if (B.mass > A.mass) [A, B] = [B, A];
  const rng = rngFor(key, 11); const e = P_E[0] + (P_E[1] - P_E[0]) * rng(); const omega = 2 * Math.PI * rng(); const phase = rng();

  const add = first.map((s) => 1.25 * (ab / s.orbit.a) * e * (1 - 2 * mu));

  return { type: 'P', key, stars: [A, B], bin, outer, mu, groups: [{ centre: 'bary', ac, planets: slots.map(toPlanet) }], dropped: A.slots.length + B.slots.length - slots.length };

const single = (s) => ({ type: 'single', key: s.key, scripted: s.scripted, stars: [s], outer: s.outer, groups: [{ centre: 0, planets: s.slots.map(toPlanet) }] });

// ---- the four options ----
function buildModel() {
  const stars = makeStars();

    const units = stars.filter((s) => !inPair.has(s.key)).map(single);

        const p = orbitPos(pl.orbit, t, c); const ppu = pxPerUnit(p); const px = 2 * pl.R * ppu; const col = mix(AGENT, tint, 0.18);
        const L = Math.hypot(c[0] - p[0], c[1] - p[1], c[2] - p[2]) || 1; const lit = [(c[0] - p[0]) / L, (c[1] - p[1]) / L, (c[2] - p[2]) / L];
        if (px >= 9) {
          counted('shells', () => shell(p, pl.R, pl.lattice, col, lit, 0.9));
          const tracksUsed = new Set();

            if (!tracksUsed.has(m.track)) { tracksUsed.add(m.track); counted('tracks', () => track(m.orbit, t, p, TRACK_DOTS.moonTrack, AGENT, 0.22)); }

          }

  // ---------- frame ----------
  let dirty = true, last = performance.now();
  function draw() {
    frameCamera(); world.begin(); hud.begin(); for (const k in CNT) CNT[k] = 0;
    const t = P.t; const units = MODEL.options[P.option]; anchor(units, P.framing);
    CLIP.on = false; counted('bg', background);   // the far background is the one thing behind the text
    CLIP.on = true; CLIP.px = 0.42 * H + 8; CLIP.m = _m.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse).elements;
    for (const u of units) drawUnit(u, t);

    info();
  }
  const fmt = (n) => n.toLocaleString('en-GB');
  function info() {
    const B = BUD[P.option], L = LIM[P.option], drawn = world.n + hud.n - CNT.bg; const hu = heroUnit(P.option);
    document.getElementById('sum').textContent = `${OPTIONS[P.option].long} · ${P.framing === 'hood' ? 'neighbourhood' : 'close'} · drawn ${fmt(drawn)} dots · budget ${fmt(B.total)}`;
    const lines = [
      `drawn now: stars ${fmt(CNT.stars)} · shells ${fmt(CNT.shells)} · moons ${fmt(CNT.moons)} · tracks ${fmt(CNT.tracks)} · plan ${fmt(CNT.plan)} (+ ${fmt(CNT.bg)} background)`,
      `budget (every shell at full lattice): stars ${fmt(B.stars)} · shells ${fmt(B.shells)} · moons ${fmt(B.moons)} · tracks ${fmt(B.tracks)} · binary plan ${fmt(B.plan)} = ${fmt(B.total)}`,
      `${B.systems} systems · ${B.pairs} pairs · ${B.planets} planets · ${B.moonsN} moons · neighbourhood radius ${extent(MODEL.options[P.option]).toFixed(0)}`,
      `stars whose outermost planet lies past the limit their nearest neighbour would set if bound: ${L.n} of ${L.of} (worst ${L.worst.toFixed(2)}×)`,
    ];
    if (hu.bin) lines.push(`middle pair: ${hu.type}-type · a ${hu.bin.a.toFixed(1)} · e ${hu.bin.e.toFixed(2)} · period ${hu.bin.period.toFixed(0)} s · limit ${hu.groups.map((g) => g.ac.toFixed(1)).join(' / ')} · planets ${hu.groups.map((g) => g.planets.length).join(' + ')}`);
    lines.push(`${W}×${H} @${P.dpr} · t ${P.t.toFixed(1)} s`);
    document.getElementById('pre').textContent = lines.join('\n');
    document.getElementById('tval').textContent = `${(P.t % T_MAX).toFixed(0)} s`;
  }
  function loop(now) {

    last = now; if (dirty) { draw(); dirty = false; } requestAnimationFrame(loop);
  }

  // ---------- ui ----------
  const timeEl = document.getElementById('time'); timeEl.max = T_MAX;
  function chips(el, map, key) {
    el.innerHTML = '';
    for (const [k, v] of Object.entries(map)) { const b = document.createElement('button'); b.textContent = typeof v === 'string' ? v : v.name; b.className = P[key] === k ? 'on' : ''; b.onclick = () => { P[key] = k; sync(); }; el.appendChild(b); }
  }
  function sync() {
    chips(document.getElementById('options'), OPTIONS, 'option'); document.getElementById('frameBtn').textContent = FRAMINGS[P.framing];
    const sp = document.getElementById('speeds'); sp.innerHTML = '';
    for (const s of SPEEDS) { const b = document.createElement('button'); b.textContent = `×${s}`; b.className = P.speed === s ? 'on' : ''; b.onclick = () => { P.speed = s; P.live = true; sync(); }; sp.appendChild(b); }
    document.getElementById('play').textContent = P.live ? '❚❚' : '▶';
    document.getElementById('planBtn').className = P.plan ? 'on' : '';
    document.getElementById('desc').textContent = OPTIONS[P.option].desc;
    document.getElementById('band').classList.toggle('show', P.band);
    document.getElementById('bottom').classList.toggle('hidden', !P.ui); document.getElementById('top').style.display = P.ui ? '' : 'none';
    try { const u = new URL(location.href); u.searchParams.set('o', P.option); u.searchParams.set('f', P.framing); history.replaceState(null, '', u); } catch (e) { /* file:// or a framed page may refuse */ }
    dirty = true;
  }
  timeEl.oninput = () => { P.t = parseFloat(timeEl.value); P.live = false; sync(); };
  document.getElementById('play').onclick = () => { P.live = !P.live; sync(); };
  document.getElementById('planBtn').onclick = () => { P.plan = !P.plan; sync(); };
  document.getElementById('frameBtn').onclick = () => { P.framing = P.framing === 'hood' ? 'close' : 'hood'; sync(); };
  document.getElementById('bandBtn').onclick = () => { P.band = !P.band; sync(); };
  document.getElementById('uiBtn').onclick = () => { P.ui = !P.ui; sync(); };
  const step = (d) => { P.option = ORDER[(ORDER.indexOf(P.option) + d + ORDER.length) % ORDER.length]; sync(); };
  let p0 = null;
  stage.addEventListener('pointerdown', (e) => { p0 = [e.clientX, e.clientY]; });
  stage.addEventListener('pointerup', (e) => { if (!p0) return; const dx = e.clientX - p0[0], dy = e.clientY - p0[1]; p0 = null; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1); });
  window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });

  resize(); sync(); requestAnimationFrame(loop);
  window.__mock = { P, MODEL, BUD, LIM, T_MAX, draw: () => { draw(); dirty = false; }, sync, counts: () => ({ ...CNT, drawn: world.n + hud.n - CNT.bg }) };
};
