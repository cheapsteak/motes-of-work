name: e2e

# The full e2e (`npm run e2e:full`), sharded over 8 jobs, on every push to main and reskin-wip and on
# demand; typecheck and the unit tests run beside it. Each shard builds the site once (the Playwright
# config's web server) and writes a blob report; the last job merges them into one HTML report.
# The shards run in the Playwright image of this repo's pinned version (package.json
# @playwright/test), so the Chromium build that draws the pages is the one the stills were shot with.
on:
  push:
    branches: [main, reskin-wip]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the tiers' check (src/e2eTiers.test.ts), which lists the e2e tests through Playwright.
      - run: npm test

  e2e:
    name: e2e shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The stills, the pixel gates and the layout checks were all measured where system-ui is DejaVu
      # Sans. The image ships no DejaVu, so its system-ui falls to a face with other widths (a slider's
      # value overflowed its column in compare.spec.ts). Install the face; print what system-ui is.
      - name: The face the checks were measured with
        run: |
          echo "system-ui before: $(fc-match system-ui)"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core > /dev/null
          echo "system-ui after: $(fc-match system-ui)"
      - name: e2e:full, shard ${{ matrix.shard }} of 8
        run: npm run e2e:full -- --shard=${{ matrix.shard }}/8 --reporter=blob,list
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
      # A failure's screenshots and attachments (the purity fence's jump, scroll and detour images).
      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: merge the shards' reports
    needs: [e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
