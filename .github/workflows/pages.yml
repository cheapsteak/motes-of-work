name: Pages preview

# Publishes the built site (the essay, and the hardware spike pages under /src/spikes/) to GitHub
# Pages on every push to main. Pages must be enabled once: README, "Preview deploy".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Never publish untested code: typecheck and the unit tests (which include the content lint).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # configure-pages reports the base path without a trailing slash (empty for a user site).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
