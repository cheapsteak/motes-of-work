name: CI

# Typecheck and the unit tests on every other branch and on pull requests. main and reskin-wip run
# them, with the sharded full e2e, in e2e.yml, which also runs on demand on any branch.
on:
  push:
    branches-ignore: [main, reskin-wip]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
