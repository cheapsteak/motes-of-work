name: CI

# Typecheck and the unit tests on every other branch and on pull requests. main, reskin-wip and the
# task branches (task-*) run them, with the sharded full e2e, in e2e.yml, which also runs on demand on
# any branch. This workflow runs no e2e.
on:
  push:
    branches-ignore: [main, reskin-wip, 'task-*']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch (or pull request) cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
